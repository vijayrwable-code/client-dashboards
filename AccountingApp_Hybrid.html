<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting & Invoice Management - Cloud Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #fafafa; color: #1a1a1a; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        header { background: #ffffff; border-bottom: 1px solid #e0e0e0; padding: 20px 24px; margin: -24px -24px 24px -24px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; }
        .header-info { font-size: 13px; color: #666666; }
        .auth-container { max-width: 420px; margin: 80px auto; padding: 40px; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; }
        .auth-container h2 { font-size: 18px; margin-bottom: 30px; text-align: center; color: #1a1a1a; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333333; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d0d0d0; border-radius: 6px; font-family: inherit; font-size: 13px; background: #ffffff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0,102,204,0.1); }
        button { background: #0066cc; color: #ffffff; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; width: 100%; transition: background 0.2s; }
        button:hover { background: #0052a3; }
        button.secondary { background: #ffffff; color: #0066cc; border: 1px solid #0066cc; }
        button.secondary:hover { background: #f0f7ff; }
        .tabs { display: flex; border-bottom: 1px solid #e0e0e0; margin-bottom: 24px; background: #ffffff; border-radius: 8px 8px 0 0; padding: 0 16px; }
        .tab-button { padding: 12px 16px; border: none; background: transparent; border-bottom: 3px solid transparent; cursor: pointer; font-size: 13px; font-weight: 600; color: #666666; }
        .tab-button.active { border-bottom-color: #0066cc; color: #0066cc; }
        .tab-content { display: none; background: #ffffff; padding: 24px; border-radius: 0 0 8px 8px; border: 1px solid #e0e0e0; border-top: none; }
        .tab-content.active { display: block; }
        .section-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #e0e0e0; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
        th, td { padding: 12px; text-align: left; border: 1px solid #e0e0e0; }
        th { background: #f5f5f5; font-weight: 600; }
        tr:hover { background: #fafafa; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-row.full { grid-template-columns: 1fr; }
        .button-group { display: flex; gap: 12px; margin-top: 20px; }
        .button-group button { flex: 1; }
        .logout-btn { background: #ef4444; padding: 8px 16px; font-size: 12px; border-radius: 6px; }
        .logout-btn:hover { background: #dc2626; }
        .admin-badge { display: inline-block; background: #0066cc; color: #ffffff; padding: 4px 10px; font-size: 11px; border-radius: 4px; margin-left: 12px; font-weight: 600; }
        .hidden { display: none; }
        .sync-badge { display: inline-block; background: #22c55e; color: #ffffff; padding: 4px 10px; font-size: 11px; border-radius: 4px; margin-left: 8px; font-weight: 600; }
        .sync-badge.syncing { background: #f59e0b; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 4px; font-size: 14px; color: #ef4444; }
        small { color: #666666; font-size: 12px; }
    </style>
</head>
<body>

<div id="authContainer" class="auth-container">
    <h2>Accounting System</h2>
    <p style="text-align: center; margin-bottom: 20px; font-size: 12px; color: #666;">
        Demo: admin@demo.com / admin123
    </p>
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" value="admin@demo.com">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" value="admin123">
    </div>
    <button onclick="login()">Sign In</button>
    <div id="loginError" style="color: #ef4444; text-align: center; margin-top: 12px; font-size: 12px; display: none;"></div>
</div>

<div id="appContainer" class="hidden">
    <header>
        <div>
            <h1>Accounting & Invoice Management</h1>
            <div class="header-info">
                <span id="userEmail"></span>
                <span id="syncBadge" class="sync-badge syncing">Syncing...</span>
            </div>
        </div>
        <div style="display:flex; gap:12px;">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('outstanding')">Outstanding Report</button>
            <button class="tab-button" onclick="switchTab('invoices')">Invoice Master</button>
            <button class="tab-button" onclick="switchTab('payments')">Payment Receipts</button>
            <button class="tab-button" onclick="switchTab('tds')">TDS Tracking</button>
            <button class="tab-button" onclick="switchTab('reminders')">Tax Reminders</button>
        </div>

        <!-- Outstanding Report Tab -->
        <div id="outstanding" class="tab-content active">
            <div class="section-title">Outstanding Invoices by Client</div>
            <div id="outstandingReport"></div>
            <button onclick="exportOutstandingToPDF()" style="margin-top: 20px;">Export to PDF</button>
        </div>

        <!-- Invoice Master Tab -->
        <div id="invoices" class="tab-content">
            <div class="section-title">Add New Invoice</div>
            <div class="form-row">
                <div>
                    <label>Client Name</label>
                    <input type="text" id="invClient" placeholder="Client name">
                </div>
                <div>
                    <label>Invoice #</label>
                    <input type="text" id="invNumber" placeholder="INV-001">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>Invoice Date</label>
                    <input type="date" id="invDate">
                </div>
                <div>
                    <label>Due Date</label>
                    <input type="date" id="invDueDate">
                </div>
            </div>
            <div class="form-row full">
                <div>
                    <label>Description</label>
                    <textarea id="invDesc" placeholder="Invoice description" rows="3"></textarea>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>Total Amount (₹)</label>
                    <input type="number" id="invTotal" placeholder="0.00" step="0.01">
                </div>
                <div>
                    <label>GST %</label>
                    <input type="number" id="invGST" value="18" step="0.01">
                </div>
            </div>
            <div class="button-group">
                <button onclick="addInvoiceManual()">Add Invoice</button>
            </div>

            <div class="section-title" style="margin-top: 40px;">Import from Tally Excel</div>
            <input type="file" id="tallyFile" accept=".xlsx,.xls" style="margin-bottom: 12px;">
            <button onclick="importTallyExcel()">Import Invoices</button>

            <div class="section-title" style="margin-top: 40px;">Invoice List</div>
            <div id="invoicesList"></div>
        </div>

        <!-- Payment Receipts Tab -->
        <div id="payments" class="tab-content">
            <div class="section-title">Add Payment Receipt</div>
            <div class="form-row">
                <div>
                    <label>Client Name</label>
                    <input type="text" id="payClient" placeholder="Client name">
                </div>
                <div>
                    <label>Invoice #</label>
                    <input type="text" id="payInvoice" placeholder="INV-001">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>Payment Date</label>
                    <input type="date" id="payDate">
                </div>
                <div>
                    <label>Amount Received (₹)</label>
                    <input type="number" id="payAmount" placeholder="0.00" step="0.01">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>Payment Mode</label>
                    <select id="payMode">
                        <option>Bank Transfer</option>
                        <option>Cheque</option>
                        <option>Cash</option>
                        <option>UPI</option>
                    </select>
                </div>
                <div>
                    <label>Reference</label>
                    <input type="text" id="payRef" placeholder="Transaction ID or Cheque #">
                </div>
            </div>
            <div class="button-group">
                <button onclick="addPayment()">Add Payment</button>
            </div>

            <div class="section-title" style="margin-top: 40px;">Payment History</div>
            <div id="paymentsList"></div>
        </div>

        <!-- TDS Tracking Tab -->
        <div id="tds" class="tab-content">
            <div class="section-title">TDS Information</div>
            <div id="tdsTable"></div>
            <button onclick="exportTdsReportToPDF()" style="margin-top: 20px;">Export TDS Report</button>
        </div>

        <!-- Tax Reminders Tab -->
        <div id="reminders" class="tab-content">
            <div class="section-title">Add Tax Reminder</div>
            <div class="form-row">
                <div>
                    <label>Reminder Description</label>
                    <input type="text" id="reminderDesc" placeholder="e.g., GST Return Due">
                </div>
                <div>
                    <label>Due Date</label>
                    <input type="date" id="reminderDate">
                </div>
            </div>
            <div class="button-group">
                <button onclick="addReminder()">Add Reminder</button>
            </div>

            <div class="section-title" style="margin-top: 40px;">Upcoming Reminders</div>
            <div id="remindersList"></div>
        </div>
    </div>
</div>

<script>
// Configuration
const FIREBASE_API_KEY = "AIzaSyCGHet-5T-gILcZrLSVoTUr6Oj0uf80ljM";
const FIREBASE_PROJECT = "accounting-app-74cc8";
const FIREBASE_DB_URL = `https://${FIREBASE_PROJECT}.firebaseio.com`;

let currentUser = null;
let currentEmail = null;
let authToken = null;

// Demo accounts
const DEMO_ACCOUNTS = {
    'admin@demo.com': { password: 'admin123', role: 'admin', name: 'Admin' },
    'akhtar@demo.com': { password: 'akhtar123', role: 'client', name: 'Akhtar' }
};

// Login (supports demo accounts + cloud auth)
async function login() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('loginError');

    if (!email || !password) {
        errorDiv.textContent = 'Please enter email and password';
        errorDiv.style.display = 'block';
        return;
    }

    // Check demo accounts first
    if (DEMO_ACCOUNTS[email] && DEMO_ACCOUNTS[email].password === password) {
        currentEmail = email;
        currentUser = { email: email, role: DEMO_ACCOUNTS[email].role };
        authToken = 'demo_token_' + Date.now();
        localStorage.setItem('authEmail', email);
        localStorage.setItem('authToken', authToken);
        loadApp();
        syncToCloud();
        return;
    }

    // Try cloud authentication
    try {
        const response = await fetch(
            `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`,
            {
                method: 'POST',
                body: JSON.stringify({
                    email: email,
                    password: password,
                    returnSecureToken: true
                })
            }
        );

        const data = await response.json();

        if (data.error) {
            errorDiv.textContent = 'Invalid email or password';
            errorDiv.style.display = 'block';
            return;
        }

        currentEmail = email;
        authToken = data.idToken;
        localStorage.setItem('authEmail', email);
        localStorage.setItem('authToken', authToken);
        loadApp();
        syncToCloud();

    } catch (error) {
        errorDiv.textContent = 'Login error: ' + error.message;
        errorDiv.style.display = 'block';
    }
}

function logout() {
    currentUser = null;
    currentEmail = null;
    authToken = null;
    localStorage.removeItem('authEmail');
    localStorage.removeItem('authToken');
    document.getElementById('appContainer').classList.add('hidden');
    document.getElementById('authContainer').classList.remove('hidden');
}

function loadApp() {
    document.getElementById('authContainer').classList.add('hidden');
    document.getElementById('appContainer').classList.remove('hidden');
    document.getElementById('userEmail').textContent = currentEmail;
    loadOutstanding();
    loadInvoices();
    loadPayments();
    loadReminders();
}

// Sync functions
function updateSyncStatus(synced) {
    const badge = document.getElementById('syncBadge');
    if (synced) {
        badge.textContent = '✓ Synced';
        badge.classList.remove('syncing');
    } else {
        badge.textContent = 'Syncing...';
        badge.classList.add('syncing');
    }
}

async function syncToCloud() {
    updateSyncStatus(false);

    if (!authToken || !currentEmail) return;
    if (authToken.startsWith('demo_token')) return; // Skip demo accounts

    try {
        const sanitizedEmail = currentEmail.replace(/\./g, '_').replace(/@/g, '_');
        const invoices = JSON.parse(localStorage.getItem(`invoices_${currentEmail}`) || '[]');
        const payments = JSON.parse(localStorage.getItem(`payments_${currentEmail}`) || '[]');

        if (invoices.length > 0) {
            await fetch(`${FIREBASE_DB_URL}/users/${sanitizedEmail}/invoices.json?auth=${authToken}`, {
                method: 'PUT',
                body: JSON.stringify(invoices)
            });
        }

        if (payments.length > 0) {
            await fetch(`${FIREBASE_DB_URL}/users/${sanitizedEmail}/payments.json?auth=${authToken}`, {
                method: 'PUT',
                body: JSON.stringify(payments)
            });
        }

        updateSyncStatus(true);
    } catch (error) {
        console.log('Cloud sync paused (working offline)');
    }
}

// Invoice Functions
function addInvoiceManual() {
    const client = document.getElementById('invClient').value;
    const number = document.getElementById('invNumber').value;
    const date = document.getElementById('invDate').value;
    const total = parseFloat(document.getElementById('invTotal').value);

    if (!client || !number || !date || !total) {
        alert('Please fill in required fields');
        return;
    }

    const invoices = JSON.parse(localStorage.getItem(`invoices_${currentEmail}`) || '[]');
    invoices.push({
        id: Date.now().toString(),
        client,
        number,
        date: formatDateDDMMYYYY(new Date(date)),
        totalAmount: total,
        status: 'Unpaid'
    });

    localStorage.setItem(`invoices_${currentEmail}`, JSON.stringify(invoices));
    loadInvoices();
    clearInvoiceForm();
    syncToCloud();
}

function loadInvoices() {
    const invoices = JSON.parse(localStorage.getItem(`invoices_${currentEmail}`) || '[]');

    let html = '<table><tr><th>Invoice #</th><th>Client</th><th>Date</th><th>Amount</th><th>Status</th><th>Actions</th></tr>';
    invoices.forEach(inv => {
        html += `<tr>
            <td>${inv.number}</td>
            <td>${inv.client}</td>
            <td>${inv.date}</td>
            <td>₹${inv.totalAmount.toFixed(2)}</td>
            <td>${inv.status}</td>
            <td><button class="icon-btn" onclick="deleteInvoice('${inv.id}')">✕</button></td>
        </tr>`;
    });
    html += '</table>';
    document.getElementById('invoicesList').innerHTML = html || '<p>No invoices</p>';
}

function deleteInvoice(id) {
    if (!confirm('Delete this invoice?')) return;

    let invoices = JSON.parse(localStorage.getItem(`invoices_${currentEmail}`) || '[]');
    invoices = invoices.filter(inv => inv.id !== id);
    localStorage.setItem(`invoices_${currentEmail}`, JSON.stringify(invoices));
    loadInvoices();
    syncToCloud();
}

function clearInvoiceForm() {
    document.getElementById('invClient').value = '';
    document.getElementById('invNumber').value = '';
    document.getElementById('invDate').value = '';
    document.getElementById('invTotal').value = '';
}

// Payment Functions
function addPayment() {
    const client = document.getElementById('payClient').value;
    const invoice = document.getElementById('payInvoice').value;
    const date = document.getElementById('payDate').value;
    const amount = parseFloat(document.getElementById('payAmount').value);

    if (!client || !invoice || !date || !amount) {
        alert('Please fill in required fields');
        return;
    }

    const payments = JSON.parse(localStorage.getItem(`payments_${currentEmail}`) || '[]');
    payments.push({
        id: Date.now().toString(),
        client,
        invoiceNumber: invoice,
        date: formatDateDDMMYYYY(new Date(date)),
        amountReceived: amount
    });

    localStorage.setItem(`payments_${currentEmail}`, JSON.stringify(payments));
    loadPayments();
    clearPaymentForm();
    syncToCloud();
}

function loadPayments() {
    const payments = JSON.parse(localStorage.getItem(`payments_${currentEmail}`) || '[]');

    let html = '<table><tr><th>Date</th><th>Client</th><th>Invoice #</th><th>Amount</th><th>Actions</th></tr>';
    payments.forEach(pay => {
        html += `<tr>
            <td>${pay.date}</td>
            <td>${pay.client}</td>
            <td>${pay.invoiceNumber}</td>
            <td>₹${pay.amountReceived.toFixed(2)}</td>
            <td><button class="icon-btn" onclick="deletePayment('${pay.id}')">✕</button></td>
        </tr>`;
    });
    html += '</table>';
    document.getElementById('paymentsList').innerHTML = html || '<p>No payments</p>';
}

function deletePayment(id) {
    if (!confirm('Delete this payment?')) return;

    let payments = JSON.parse(localStorage.getItem(`payments_${currentEmail}`) || '[]');
    payments = payments.filter(pay => pay.id !== id);
    localStorage.setItem(`payments_${currentEmail}`, JSON.stringify(payments));
    loadPayments();
    syncToCloud();
}

function clearPaymentForm() {
    document.getElementById('payClient').value = '';
    document.getElementById('payInvoice').value = '';
    document.getElementById('payDate').value = '';
    document.getElementById('payAmount').value = '';
}

// Outstanding Report
function loadOutstanding() {
    const invoices = JSON.parse(localStorage.getItem(`invoices_${currentEmail}`) || '[]');
    const payments = JSON.parse(localStorage.getItem(`payments_${currentEmail}`) || '[]');

    let clientData = {};
    invoices.forEach(inv => {
        if (!clientData[inv.client]) {
            clientData[inv.client] = { invoiced: 0, received: 0 };
        }
        clientData[inv.client].invoiced += inv.totalAmount;
    });

    payments.forEach(pay => {
        if (clientData[pay.client]) {
            clientData[pay.client].received += pay.amountReceived;
        }
    });

    let html = '';
    for (const [client, data] of Object.entries(clientData)) {
        const outstanding = data.invoiced - data.received;
        if (outstanding > 0) {
            html += `<div style="margin-bottom: 24px; padding: 16px; background: #f9f9f9; border-radius: 6px;">
                <strong>${client}</strong><br>
                Total Invoiced: ₹${data.invoiced.toFixed(2)}<br>
                Total Received: ₹${data.received.toFixed(2)}<br>
                Outstanding: <strong>₹${outstanding.toFixed(2)}</strong>
            </div>`;
        }
    }

    document.getElementById('outstandingReport').innerHTML = html || '<p>No outstanding invoices</p>';
}

// Reminders
function addReminder() {
    const desc = document.getElementById('reminderDesc').value;
    const date = document.getElementById('reminderDate').value;

    if (!desc || !date) {
        alert('Please fill in all fields');
        return;
    }

    const reminders = JSON.parse(localStorage.getItem(`reminders_${currentEmail}`) || '[]');
    reminders.push({
        id: Date.now().toString(),
        description: desc,
        dueDate: formatDateDDMMYYYY(new Date(date))
    });

    localStorage.setItem(`reminders_${currentEmail}`, JSON.stringify(reminders));
    loadReminders();
    document.getElementById('reminderDesc').value = '';
    document.getElementById('reminderDate').value = '';
    syncToCloud();
}

function loadReminders() {
    const reminders = JSON.parse(localStorage.getItem(`reminders_${currentEmail}`) || '[]');

    let html = '<table><tr><th>Description</th><th>Due Date</th><th>Actions</th></tr>';
    reminders.forEach(rem => {
        html += `<tr>
            <td>${rem.description}</td>
            <td>${rem.dueDate}</td>
            <td><button class="icon-btn" onclick="deleteReminder('${rem.id}')">✕</button></td>
        </tr>`;
    });
    html += '</table>';
    document.getElementById('remindersList').innerHTML = html || '<p>No reminders</p>';
}

function deleteReminder(id) {
    if (!confirm('Delete this reminder?')) return;

    let reminders = JSON.parse(localStorage.getItem(`reminders_${currentEmail}`) || '[]');
    reminders = reminders.filter(rem => rem.id !== id);
    localStorage.setItem(`reminders_${currentEmail}`, JSON.stringify(reminders));
    loadReminders();
    syncToCloud();
}

// Tab Switching
function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));

    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');

    if (tabName === 'outstanding') loadOutstanding();
    if (tabName === 'payments') loadPayments();
}

// Utility
function formatDateDDMMYYYY(date) {
    if (typeof date === 'string') return date;
    const d = String(date.getDate()).padStart(2, '0');
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const y = date.getFullYear();
    return `${d}-${m}-${y}`;
}

// Placeholders
function exportOutstandingToPDF() { alert('Export coming soon'); }
function exportTdsReportToPDF() { alert('Export coming soon'); }
function importTallyExcel() { alert('Import coming soon'); }

// Auto-login if token exists
window.addEventListener('load', () => {
    const savedEmail = localStorage.getItem('authEmail');
    const savedToken = localStorage.getItem('authToken');
    if (savedEmail && savedToken) {
        currentEmail = savedEmail;
        authToken = savedToken;
        loadApp();
    }
});
</script>

</body>
</html>
