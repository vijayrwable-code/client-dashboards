<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting & Invoice Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            text-align: center;
        }
        h1 {
            font-size: 42px;
            color: white;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
        }
        .apps {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }
        @media (max-width: 600px) {
            .apps {
                grid-template-columns: 1fr;
            }
        }
        .app-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-decoration: none;
            color: #333;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        .app-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .app-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }
        .app-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .footer {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Accounting System</h1>
        <div class="subtitle">Select your role to access the application</div>

        <div class="apps">
            <a href="AccountingApp_Firebase_CloudSync.html" class="app-card">
                <div class="app-icon">🔐</div>
                <div class="app-title">Admin Panel</div>
                <div class="app-desc">Manage invoices, payments, TDS tracking, and generate client dashboards</div>
            </a>

            <a href="ClientDashboard_SAMPLE.html" class="app-card">
                <div class="app-icon">👤</div>
                <div class="app-title">Client Dashboard</div>
                <div class="app-desc">View your invoices, payments, and tax information</div>
            </a>
        </div>

        <div class="footer">
            🚀 Deployed on GitHub Pages | Built with HTML + JavaScript
        </div>
    </div>
</body>
</html>
